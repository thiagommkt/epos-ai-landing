name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'epos-dashboard.html'
      - 'fm-dashboard.html'
      - 'guides/**'
      - 'login-*.html'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate HTML (div balance)
        run: python scripts/validate_html.py

      - name: Sync guides from root files
        run: python scripts/sync_guides.py --no-validate

      - name: Validate synced guides
        run: python scripts/validate_html.py

      - name: Commit synced guides if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guides/
          git diff --staged --quiet && echo "guides up-to-date" || git commit -m "chore: sync guides from root files [ci skip]"
          git diff HEAD~1 --quiet 2>/dev/null && echo "nothing to push" || git push

      # GitHub Pages serve from main branch (configured in repo settings)
      # CF purge: rodar localmente com scripts/purge_cf.ps1 após o push
