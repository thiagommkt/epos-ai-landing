name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'epos-dashboard.html'
      - 'fm-dashboard.html'
      - 'guides/**'
      - 'login-*.html'
      - 'scripts/**'

jobs:
  build-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate HTML (div balance)
        run: python scripts/validate_html.py

      - name: Sync guides from root files
        run: python scripts/sync_guides.py --no-validate

      - name: Validate synced guides
        run: python scripts/validate_html.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,scripts,node_modules,*.py,*.md'

      # CF purge: rodar localmente com scripts/purge_cf.ps1 após o push
