<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Método Venda Inevitável | Epos</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://eposmktfilmsia.com.br/metodo/">
<!-- 04/11/2026 (Thiago): a página do Método mudou para o site (eposmktfilmsia.com.br/metodo/).
     Quem abre o link antigo vai para lá com tudo o que trouxe: UTMs, ?c= do convidado, ?equipe=1, #bloco,
     e a mesma sessão do rastreamento (_sid) e as marcas deste aparelho (equipe, convidado), que ficam guardadas por domínio. -->
<meta http-equiv="refresh" content="2;url=https://eposmktfilmsia.com.br/metodo/">
<script>
(function(){
  var destino = new URL('https://eposmktfilmsia.com.br/metodo/');
  var p = new URLSearchParams(location.search);
  p.forEach(function(v, k){ destino.searchParams.set(k, v); });
  try {
    var sid = localStorage.getItem('_lp_sid');
    if (sid && !destino.searchParams.get('_sid')) destino.searchParams.set('_sid', sid);
    if (localStorage.getItem('_lp_equipe') === '1' && !destino.searchParams.get('equipe')) destino.searchParams.set('equipe', '1');
    var conv = localStorage.getItem('_lp_convidado');
    if (conv && !destino.searchParams.get('c') && !destino.searchParams.get('utm_source')) destino.searchParams.set('c', conv);
  } catch(e){}
  destino.hash = location.hash;
  location.replace(destino.toString());
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E0E10;color:#f2f2f4;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px}a{color:#B58CFF}</style>
</head>
<body>
<p>A página do Método mudou de endereço.<br><a href="https://eposmktfilmsia.com.br/metodo/">Abrir eposmktfilmsia.com.br/metodo</a></p>
</body>
</html>
